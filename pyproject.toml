[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-fabric"
version = "0.2.0"
description = "Fabric // ClothOS Agentic Operating System (Loom · Stitch · Torque) — Proprietary Sovereign Distributed AI Compute Stack"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Najmos Sakib", email = "natsakib@gmail.com" }
]
classifiers = [
    "Private :: Do Not Upload",
    "License :: Other/Proprietary License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ray[default]>=2.9.0",
    "pydantic>=2.5.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "nvidia-ml-py>=12.535.133",
    "psutil>=5.9.0",
    "httpx>=0.26.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
]

[project.scripts]
fabric = "loom.cli.main:app"
loom = "loom.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["loom*", "fabric*"]
