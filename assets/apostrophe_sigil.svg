<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070B" />
    </radialGradient>

    <!-- Champion Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Electric Cyan Gradient for Sovereign Compute Core -->
    <linearGradient id="cyanCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077FE" />
      <stop offset="50%" stop-color="#00D2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Platinum Accent Gradient -->
    <linearGradient id="platinumGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadow Filter for Floating Depth -->
    <filter id="sigilShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#00F0FF" flood-opacity="0.25" />
    </filter>

    <filter id="coreGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" />

  <g filter="url(#sigilShadow)">
    <!-- ========================================== -->
    <!-- 1. THE TROPHY CUP & HANDLES                -->
    <!-- Formed by dual mirrored Apostrophes (’)   -->
    <!-- ========================================== -->

    <!-- Left Trophy Handle / Outer Apostrophe Sweeps -->
    <path d="M 176 130 
             C 110 130 90 210 110 270 
             C 125 315 165 345 200 350
             C 170 330 150 290 145 260
             C 140 230 150 170 185 155
             C 192 152 186 130 176 130 Z" 
          fill="url(#goldMetallic)" opacity="0.9" />

    <!-- Right Trophy Handle / Mirrored Apostrophe Sweeps -->
    <path d="M 336 130 
             C 402 130 422 210 402 270 
             C 387 315 347 345 312 350
             C 342 330 362 290 367 260
             C 372 230 362 170 327 155
             C 320 152 326 130 336 130 Z" 
          fill="url(#goldMetallic)" opacity="0.9" />

    <!-- Trophy Central Chalice / Body Bowl -->
    <path d="M 170 140
             C 170 260 210 320 256 345
             C 302 320 342 260 342 140
             C 310 155 285 160 256 160
             C 227 160 202 155 170 140 Z"
          fill="url(#platinumGleam)" stroke="url(#goldMetallic)" stroke-width="3" />

    <!-- Chalice Rim / Sovereign Crown Arc -->
    <path d="M 160 140 Q 256 168 352 140 Q 256 125 160 140 Z"
          fill="url(#goldMetallic)" />

    <!-- ========================================== -->
    <!-- 2. THE FLOATING SOVEREIGN APOSTROPHE FLAME  -->
    <!-- Grammatical 'Possession' & Compute Core   -->
    <!-- ========================================== -->
    <g filter="url(#coreGlow)">
      <!-- Central Iconic Apostrophe (’) Flame of Ownership -->
      <path d="M 256 180 
               C 278 180 295 198 295 220 
               C 295 245 275 270 252 295 
               C 246 302 238 308 234 314
               C 232 316 230 310 232 302
               C 236 285 248 266 250 255
               C 230 255 217 240 217 220
               C 217 198 234 180 256 180 Z" 
            fill="url(#cyanCore)" />

      <!-- Inner Radiant Hotspot -->
      <circle cx="256" cy="216" r="14" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- ========================================== -->
    <!-- 3. THE STEM, KEYHOLE & OWNERSHIP PEDESTAL  -->
    <!-- Symbolizing Sovereign Custody & Foundation -->
    <!-- ========================================== -->

    <!-- Trophy Stem -->
    <path d="M 246 343 L 266 343 L 268 395 L 244 395 Z" 
          fill="url(#goldMetallic)" />

    <!-- Stem Collar / Flange -->
    <rect x="236" y="375" width="40" height="8" rx="4" fill="url(#platinumGleam)" />

    <!-- Pedestal Base of Ownership -->
    <path d="M 200 415 
             L 220 395 
             L 292 395 
             L 312 415 
             L 326 430
             L 186 430 Z" 
          fill="url(#goldMetallic)" />

    <rect x="176" y="430" width="160" height="14" rx="4" fill="#1E293B" stroke="url(#goldMetallic)" stroke-width="2" />

    <!-- Ownership Keyhole Emblem on Pedestal Base -->
    <!-- Represents the root of trust, private key, and possessive lock -->
    <circle cx="256" cy="411" r="5" fill="#0B0F19" />
    <polygon points="253,411 259,411 261,421 251,421" fill="#0B0F19" />

    <!-- Subtle Victory Stars / Constellation Points -->
    <polygon points="256,105 259,114 268,114 261,120 263,129 256,123 249,129 251,120 244,114 253,114" 
             fill="#FDE68A" />
  </g>
</svg>
