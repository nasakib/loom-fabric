<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Void Background: Jovian Night & Galactic Center Rift -->
    <radialGradient id="cosmicVoidBg" cx="50%" cy="45%" r="68%">
      <stop offset="0%" stop-color="#220A45" />
      <stop offset="30%" stop-color="#140428" />
      <stop offset="65%" stop-color="#090214" />
      <stop offset="100%" stop-color="#030006" />
    </radialGradient>

    <!-- Jovian Imperial Violet Magnetosphere Gradient -->
    <linearGradient id="jovianPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="20%" stop-color="#D8B4FE" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="85%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>

    <!-- Alabaster Celestial Starlight Gradient -->
    <linearGradient id="celestialStarlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FAF5FF" />
      <stop offset="80%" stop-color="#E9D5FF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Sagittarius A* Relativistic Accretion Disk / Photon Sphere Gradient -->
    <radialGradient id="sgrAAccretion" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FDF4FF" />
      <stop offset="55%" stop-color="#D946EF" />
      <stop offset="85%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#3B0764" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Event Horizon Black Hole Gradient (Schwarzschild Singularity) -->
    <radialGradient id="eventHorizon" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="82%" stop-color="#08020F" />
      <stop offset="96%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#A855F7" />
    </radialGradient>

    <!-- Jovian Auroral Storm Filter -->
    <filter id="cosmicBloom" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="glow1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="glow2" />
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="glow2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gravitational Lensing Shadow Filter -->
    <filter id="gravitationalLensing" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="0" stdDeviation="32" flood-color="#9333EA" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. DEEP SPACE CANVAS & SAGITTARIUS CONSTELLATION ASTERISM -->
  <!-- ======================================================== -->
  <rect width="512" height="512" rx="96" fill="url(#cosmicVoidBg)" />

  <!-- Sagittarius "Teapot" & Archer's Bow Constellation Vector Lines (Faint Celestial Grids) -->
  <g stroke="#9333EA" stroke-width="0.8" opacity="0.35" fill="none" stroke-dasharray="2 4">
    <!-- The Archer's Bow (Kaus Borealis -> Kaus Media -> Kaus Australis) -->
    <path d="M 125 150 L 155 210 L 140 280 L 115 340" />
    <!-- The Arrow Path aiming directly toward Sagittarius A* Singularity (Center 256, 214) -->
    <path d="M 85 245 L 235 220" stroke="#FAF5FF" stroke-width="1.2" stroke-dasharray="none" opacity="0.4" />
    <!-- Teapot Handle and Lid lines -->
    <path d="M 385 150 L 355 210 L 370 280 L 395 340" />
    <path d="M 155 210 L 355 210" />
  </g>

  <!-- Celestial Coordinate Orbital Meridian Rings -->
  <circle cx="256" cy="245" r="220" fill="none" stroke="#3B0764" stroke-width="1.5" opacity="0.6" />
  <circle cx="256" cy="245" r="212" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-dasharray="4 10" opacity="0.4" />
  <circle cx="256" cy="245" r="186" fill="none" stroke="#7E22CE" stroke-width="1.2" opacity="0.3" />

  <!-- Constellation Major Stars (Nunki, Ascella, Kaus Australis, Kaus Borealis) -->
  <g fill="#FFFFFF" opacity="0.9">
    <!-- Kaus Borealis (Apex of Bow) -->
    <circle cx="125" cy="150" r="3.2" filter="url(#cosmicBloom)" />
    <!-- Nunki (Vane of the Arrow) -->
    <circle cx="385" cy="150" r="3.2" filter="url(#cosmicBloom)" />
    <!-- Kaus Australis (Base of Bow) -->
    <circle cx="115" cy="340" r="2.8" />
    <!-- Ascella -->
    <circle cx="395" cy="340" r="2.8" />
    <!-- Four Galilean Moon Puncta (Io, Europa, Ganymede, Callisto) orbiting Jovian horizon -->
    <circle cx="256" cy="36" r="3.5" />
    <circle cx="256" cy="454" r="3.5" />
    <circle cx="46" cy="245" r="3" />
    <circle cx="466" cy="245" r="3" />
  </g>

  <!-- Gravitational Lensing Relativistic Accretion Aura of Sagittarius A* -->
  <circle cx="256" cy="218" r="135" fill="url(#sgrAAccretion)" opacity="0.8" />

  <!-- ======================================================== -->
  <!-- 2. THE SOVEREIGN CHALICE & JOVIAN MAGNETOSPHERE WINGS    -->
  <!-- Formed by dual sweeping mirrored Apostrophes (’)         -->
  <!-- ======================================================== -->
  <g filter="url(#gravitationalLensing)">

    <!-- Left Jovian Wing / Outer Apostrophe Sweeping Handle -->
    <path d="M 174 122 
             C 96 122 72 214 94 280 
             C 112 332 158 362 198 367
             C 166 344 140 300 134 266
             C 128 230 140 164 180 148
             C 188 145 185 122 174 122 Z" 
          fill="url(#celestialStarlight)" 
          stroke="url(#jovianPurple)" 
          stroke-width="2.5" />

    <!-- Right Jovian Wing / Mirrored Outer Apostrophe Sweeping Handle -->
    <path d="M 338 122 
             C 416 122 440 214 418 280 
             C 400 332 354 362 314 367
             C 346 344 372 300 378 266
             C 384 230 372 164 332 148
             C 324 145 327 122 338 122 Z" 
          fill="url(#celestialStarlight)" 
          stroke="url(#jovianPurple)" 
          stroke-width="2.5" />

    <!-- Central Reliquary Chalice: Jovian Cloud Deck & Deep Void Interior -->
    <path d="M 166 134
             C 166 266 208 336 256 362
             C 304 336 346 266 346 134
             C 310 152 284 158 256 158
             C 228 158 202 152 166 134 Z"
          fill="url(#cosmicVoidBg)" 
          stroke="url(#celestialStarlight)" 
          stroke-width="3" />

    <!-- Jovian Great Red/Violet Spot Innuendo & Atmospheric Latitudinal Bands -->
    <path d="M 188 185 Q 256 200 324 185" fill="none" stroke="#581C87" stroke-width="1.8" opacity="0.6" />
    <path d="M 198 230 Q 256 248 314 230" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.5" />
    <path d="M 215 275 Q 256 290 297 275" fill="none" stroke="#A855F7" stroke-width="1.8" opacity="0.5" />

    <!-- Chalice Rim / Sovereign Crown Arc -->
    <path d="M 156 134 Q 256 166 356 134 Q 256 116 156 134 Z"
          fill="url(#celestialStarlight)" />

    <!-- ======================================================== -->
    <!-- 3. SAGITTARIUS A* SINGULARITY & SACRED APOSTROPHE FLAME   -->
    <!-- The Event Horizon of Absolute Sovereign Custody          -->
    <!-- ======================================================== -->
    <g filter="url(#cosmicBloom)">
      <!-- The Ascending Apostrophe (’) Relativistic Cosmic Jet -->
      <path d="M 256 166 
               C 284 166 304 188 304 216 
               C 304 246 280 276 250 306 
               C 242 314 233 322 228 328
               C 225 330 223 324 225 315
               C 230 294 244 270 246 256
               C 222 256 205 238 205 216
               C 205 188 226 166 256 166 Z" 
            fill="url(#celestialStarlight)" />

      <!-- Sagittarius A* Supermassive Black Hole Event Horizon (Center of Custody) -->
      <!-- Black circular core inside the head of the Apostrophe -->
      <circle cx="256" cy="214" r="17" fill="url(#eventHorizon)" />
      
      <!-- Relativistic Photon Ring: White-Hot Laser Lensing Ring around the Singularity -->
      <circle cx="256" cy="214" r="18" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="256" cy="214" r="25" fill="none" stroke="#E879F9" stroke-width="1.2" opacity="0.8" />

      <!-- The Archer's Sovereign Arrow Star of Chiron (Apex of Directional Will) -->
      <polygon points="256,88 259,98 270,98 261,105 264,115 256,109 248,115 251,105 242,98 253,98" 
               fill="#FFFFFF" />
    </g>

    <!-- ======================================================== -->
    <!-- 4. JOVIAN TEMPLE ALTAR & THE IMMUTABLE SINGULARITY KEYHOLE -->
    <!-- Physical Behind-the-Meter Custody Pedestal               -->
    <!-- ======================================================== -->

    <!-- Monastic Chalice Stem -->
    <path d="M 245 360 L 267 360 L 270 412 L 242 412 Z" 
          fill="url(#celestialStarlight)" 
          stroke="url(#jovianPurple)" 
          stroke-width="1.5" />

    <!-- Jovian Equatorial Planetary Ring / Reliquary Knot on Stem -->
    <ellipse cx="256" cy="386" rx="28" ry="7" 
             fill="url(#jovianPurple)" 
             stroke="#FFFFFF" 
             stroke-width="1.5" />

    <!-- Altar Pedestal Steps (Sacred Geometry Plinth) -->
    <!-- Step 1: Upper Orbital Bevel -->
    <path d="M 204 424 
             L 224 412 
             L 288 412 
             L 308 424 
             L 324 438
             L 188 438 Z" 
          fill="url(#celestialStarlight)" 
          stroke="url(#jovianPurple)" 
          stroke-width="1.5" />

    <!-- Step 2: Foundation Plinth in Jovian Deep Purple with Starlight Bevel -->
    <rect x="168" y="438" width="176" height="20" rx="5" 
          fill="#120426" 
          stroke="#FFFFFF" 
          stroke-width="2.5" />

    <!-- The Singularity Keyhole (Root of Trust / Gateway to the Event Horizon) -->
    <circle cx="256" cy="425" r="5.5" fill="#FFFFFF" />
    <polygon points="253,425 259,425 262,436 250,436" fill="#FFFFFF" />

    <!-- Jovian Satellite Anchors (Callisto and Ganymede on Altar Edge) -->
    <circle cx="192" cy="448" r="2.5" fill="#FAF5FF" />
    <circle cx="320" cy="448" r="2.5" fill="#FAF5FF" />
  </g>
</svg>
